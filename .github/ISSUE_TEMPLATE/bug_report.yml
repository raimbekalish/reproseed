name: Bug report
description: A defect in the ReproSeed CLI, examples, or tests.
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a defect that is safe to describe in public. Remove credentials and other sensitive data. Do not include an exploitable vulnerability. See SECURITY.md.
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.x
    validations:
      required: true
  - type: input
    id: playwright
    attributes:
      label: Playwright version
      description: The playwright version from package-lock.json, or the output of `npm ls playwright`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Minimal reproducible scenario
      description: Commands and scenario JSON. Name the loopback app. Omit the reset credential.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Command output with credentials and tokens removed.
  - type: checkboxes
    id: sanitized
    attributes:
      label: Sensitive information
      options:
        - label: I removed credentials, tokens, and other sensitive information.
          required: true
